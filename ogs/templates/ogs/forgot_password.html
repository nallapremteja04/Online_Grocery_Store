{% extends 'ogs/base.html' %}
{% load static %}

{% block title %}Forgot Password - Online Grocery Store{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-success text-white py-3 text-center">
            <h4 class="mb-0 fw-bold">🔑 Forgot Password</h4>
            <small class="text-white-50">Enter your email address or username to receive an OTP</small>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address or Username</label>
                    <input type="text" name="email" class="form-control rounded-pill px-3 py-2" placeholder="e.g. user@grocery.com" required>
                </div>

                <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold py-2 shadow-sm">
                    Send Reset OTP
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-success text-decoration-none fw-semibold small">
                    &larr; Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
