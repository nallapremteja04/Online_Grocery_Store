{% extends 'ogs/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h4>Verify OTP</h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label>Enter OTP</label>

                            <input
                                type="text"
                                name="otp"
                                class="form-control"
                                maxlength="6"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Verify OTP

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %
